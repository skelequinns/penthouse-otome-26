project_name: "Hell is a Penthouse in Toronto"
tagline: "A contemporary dark romance. Six impossible beings. One penthouse. No exit."

# Keep unlisted during development; switch to PUBLIC when ready to share
visibility: 'UNLISTED'

# FULLSCREEN: the stage takes over the entire viewport below the header.
# The chat input is hidden — all interaction happens through the stage UI.
position: 'FULLSCREEN'

tags:
  - 'otome'
  - 'dating sim'
  - 'visual novel'
  - 'romance'
  - 'dark romance'
  - 'supernatural'
  - 'contemporary'
  - 'demons'
  - 'multiple love interests'
  - 'Toronto'

# No user-configurable options at this stage of development.
config_schema:
  type: object
  properties: {}

# State schema — chat-level save persists the full game save.
# Message-level state is used for active scene tracking.
state_schema:
  chat:
    type: object
    properties:
      save:
        type: object
  message:
    type: object
    properties:
      activeScene:
        type: object

# extension_id and github_path are auto-generated by GitHub Actions on push.
# Do not set these manually.

github_path: 'https://github.com/skelequinns/penthouse-otome-26'


extension_id: 'penthouse-otome-26-1a641b50c619'

